[[entries]]
period = "2025"
content = """I moved to Heidelberg, Germany for a new professional chapter. This period helped me understand more clearly \
what I want next. With stronger software engineering experience as a foundation, I enjoy the process of bringing my \
own ideas into a domain where machine learning can solve real problems."""

[[entries]]
period = "2024 to 2025"
content = """In spring 2024, I moved to Geneva, Switzerland to work as a Machine Learning Engineer at WIPO, United Nations. \
After several years in St. Gallen, Geneva felt like a fresh start. I met new people through work and life, \
learned how an international organization operates, and enjoyed the process of applying my ML knowledge to the IP domain."""

[[entries]]
period = "2021 to 2023"
content = """During these years, I changed my direction from Finance to Computer Science. I passed CS entrance exam, \
took CS courses, worked through many experiments for my master thesis, and had my first ML engineering internship in Zurich. \
It was not an easy transition, but it was the period when I slowly proved to myself that I could build a new path."""

[[entries]]
period = "2018 to 2020"
content = """I moved to St. Gallen, Switzerland for my studies at HSG. It became the place where I spent the most time \
outside my hometown. I studied, made friends, became more independent, and started to see Europe not only as a place \
on the map, but as part of my own life."""

[[entries]]
period = "2013 to 2018"
content = """I studied Economics at Yuanpei College, Peking University. After graduation, I spent one year contributing \
to two research projects at Tsinghua University, focusing on insurtech and fintech. \
This was where I learned how to become a professional, research an industry, ask clearer questions, and turn massive \
information into structured thinking."""
